<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>IrisSkies Astro Wheel + Dice</title>

<style>
body {
    margin: 0;
    background: #f0f0f0;
    font-family: Arial;
    display: flex;
    flex-direction: column;
    align-items: center;
}

canvas {
    margin-top: 20px;
}

/* Dice */
.dice-container {
    display: flex;
    gap: 20px;
    margin-top: 30px;
}

.die {
    width: 80px;
    height: 80px;
    background: white;
    border: 2px solid #111;
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: bold;
    cursor: pointer;
    transition: transform 1s;
}

.spin {
    transform: rotateX(720deg) rotateY(720deg);
}

.result {
    margin-top: 20px;
    font-size: 18px;
}
</style>
</head>

<body>

<h2>IrisSkies Astro Wheel + Dice</h2>

<canvas id="wheel" width="400" height="400"></canvas>

<div class="dice-container">
    <div class="die" id="planet">Planet</div>
    <div class="die" id="sign">Sign</div>
    <div class="die" id="house">House</div>
</div>

<div class="result" id="result"></div>

<script>
// DRAW WHEEL
const canvas = document.getElementById("wheel");
const ctx = canvas.getContext("2d");

const cx = 200;
const cy = 200;
const radius = 150;

for (let i = 0; i < 12; i++) {
    let angle = (i * 30) * Math.PI / 180;

    ctx.beginPath();
    ctx.moveTo(cx, cy);
    ctx.lineTo(cx + radius * Math.cos(angle), cy + radius * Math.sin(angle));
    ctx.stroke();

    // house numbers centered
    let mid = angle + (15 * Math.PI / 180);
    ctx.fillText(i + 1,
        cx + (radius - 40) * Math.cos(mid),
        cy + (radius - 40) * Math.sin(mid)
    );
}

// DATA
const planets = ["Sun","Moon","Mercury","Venus","Mars","Jupiter","Saturn","Uranus","Neptune","Pluto"];
const signs = ["Aries","Taurus","Gemini","Cancer","Leo","Virgo","Libra","Scorpio","Sagittarius","Capricorn","Aquarius","Pisces"];
const houses = ["1st","2nd","3rd","4th","5th","6th","7th","8th","9th","10th","11th","12th"];

// DICE FUNCTION
function rollDice() {
    const p = planets[Math.floor(Math.random() * planets.length)];
    const s = signs[Math.floor(Math.random() * signs.length)];
    const h = houses[Math.floor(Math.random() * houses.length)];

    document.getElementById("planet").classList.add("spin");
    document.getElementById("sign").classList.add("spin");
    document.getElementById("house").classList.add("spin");

    setTimeout(() => {
        document.getElementById("planet").innerText = p;
        document.getElementById("sign").innerText = s;
        document.getElementById("house").innerText = h;

        document.getElementById("result").innerText =
            p + " in " + s + " in the " + h + " house";

        document.querySelectorAll(".die").forEach(d => d.classList.remove("spin"));
    }, 1000);
}

// CLICK TO ROLL
document.querySelectorAll(".die").forEach(d => {
    d.onclick = rollDice;
});
</script>

</body>
</html>
