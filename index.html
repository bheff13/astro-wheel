<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Interactive Astrology Chart</title>
<style>
body { font-family: Arial, sans-serif; margin: 0; background: #f8f7f2; }
h2 { text-align:center; margin: 20px 0; }
.container { display: flex; flex-wrap: wrap; justify-content: center; gap: 20px; padding: 20px; align-items:flex-start; }
.palette-wrap { display:flex; flex-direction:column; align-items:center; gap:15px; }
.palette { display: grid; grid-template-columns: repeat(2, 120px); gap: 15px; }
.glyph {
  width: 120px; height: 100px; border: 2px solid #aaa; display: flex; align-items: center; justify-content: center;
  font-size: 40px; cursor: grab; background: #fff; user-select:none;
}
canvas { background: #fff; border: 2px solid #000; max-width:100%; height:auto; }
button { padding: 10px 20px; cursor: pointer; font-size:16px; }
@media (max-width: 800px) {
  .palette { grid-template-columns: repeat(2, minmax(100px, 1fr)); width:100%; }
  .glyph { width:auto; }
}
</style>
</head>
<body>
<h2>Interactive Astrology Chart</h2>
<div class="container">
  <div class="palette-wrap">
    <div class="palette" id="palette">
      <div class="glyph">☉</div>
      <div class="glyph">☽</div>
      <div class="glyph">☿</div>
      <div class="glyph">♀</div>
      <div class="glyph">♂</div>
      <div class="glyph">♃</div>
      <div class="glyph">♄</div>
      <div class="glyph">♅</div>
      <div class="glyph">♆</div>
      <div class="glyph">♇</div>
    </div>
    <button id="clearBtn">Clear Planets</button>
  </div>
  <canvas id="chart" width="500" height="500"></canvas>
</div>
<script>
const canvas = document.getElementById('chart');
const ctx = canvas.getContext('2d');
let placed = [];
let dragged = null;
function drawChart() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  const centerX = 250, centerY = 250, radius = 200;
  ctx.beginPath();
  ctx.arc(centerX, centerY, radius, 0, Math.PI * 2);
  ctx.strokeStyle = '#000';
  ctx.lineWidth = 2;
  ctx.stroke();
  for (let i = 0; i < 12; i++) {
    let angle = (i * 30) * Math.PI / 180;
    ctx.beginPath();
    ctx.moveTo(centerX, centerY);
    ctx.lineTo(centerX + radius * Math.cos(angle), centerY + radius * Math.sin(angle));
    ctx.stroke();
  }
  placed.forEach(p => {
    ctx.font = '28px Arial';
    ctx.fillStyle = '#000';
    ctx.fillText(p.symbol, p.x, p.y);
  });
}
drawChart();
document.querySelectorAll('.glyph').forEach(el => {
  el.addEventListener('mousedown', e => {
    dragged = e.target.innerText;
  });
});
canvas.addEventListener('mouseup', e => {
  if (!dragged) return;
  const rect = canvas.getBoundingClientRect();
  placed.push({ symbol: dragged, x: e.clientX - rect.left, y: e.clientY - rect.top });
  dragged = null;
  drawChart();
});
document.getElementById('clearBtn').addEventListener('click', () => {
  placed = [];
  drawChart();
});
window.addEventListener('mouseup', () => { dragged = null; });
</script>
</body>
</html>
